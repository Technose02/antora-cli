[workspace]
members = ["antora-cli", "antora-fs", "antora-process", "antora-project", "relative-path", "init-task", "init-templates"]
default-members = [ "antora-cli" ]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Technose02 <technose02@yahoo.de>"]
license = "MIT"

[workspace.dependencies]
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
