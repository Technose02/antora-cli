[package]
name = "antora-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
clap = { workspace = true }
regex = { workspace = true }
webbrowser = "1.0.6"
xml = "1.2.0"
antora-project = { path = "../antora-project" }
antora-fs = { path = "../antora-fs" }
antora-process = { path = "../antora-process" }
relative-path = { path = "../relative-path" }
init-task = { path = "../init-task" }
init-templates = { path = "../init-templates" }
ctrlc = "3.5.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
